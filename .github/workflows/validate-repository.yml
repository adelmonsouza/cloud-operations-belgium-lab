name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required structure
        shell: bash
        run: |
          bash scripts/validate-structure.sh

      - name: Check for obvious sensitive patterns
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE --exclude-dir=.git --exclude='*.gitkeep' \
            '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' .; then
            echo "Sensitive credential-like pattern detected." >&2
            exit 1
          fi

          if find . -path ./.git -prune -o \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' -o -name 'terraform.tfstate' -o -name 'terraform.tfstate.*' -o -name '*.tfvars' \) -print | grep -q .; then
            echo "Sensitive file type detected." >&2
            find . -path ./.git -prune -o \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' -o -name 'terraform.tfstate' -o -name 'terraform.tfstate.*' -o -name '*.tfvars' \) -print
            exit 1
          fi
